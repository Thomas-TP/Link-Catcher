name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:listing
      - name: Valider manifest.json et les traductions
        run: |
          node -e "const m=require('./manifest.json');if(m.manifest_version!==3)process.exit(1);if(m.host_permissions)throw new Error('host_permissions inattendu');console.log('manifest ok', m.version)"
          for f in _locales/*/messages.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: link-catcher-package
          path: dist/*.zip
