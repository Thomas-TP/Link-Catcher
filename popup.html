<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Link Catcher</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <!-- TOASTS -->
  <div id="toast-container"></div>

  <!-- CONFIRM OVERLAY -->
  <div class="overlay" id="confirm-overlay" style="z-index: 200;">
    <div class="glass-card confirm-card" style="width: 85%;">
      <h2 id="confirm-title">Attention</h2>
      <p id="confirm-message" class="desc" style="margin-bottom: 20px;">Voulez-vous continuer ?</p>
      <div id="confirm-actions" class="form-actions" style="flex-wrap: wrap;">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <div class="container">
    <!-- HEADER -->
    <header>
      <img src="icon.png" alt="Logo" class="logo">
      <div class="header-text">
        <h1>Link Catcher</h1>
        <p data-i18n="header_subtitle">Vos liens instantanés</p>
      </div>
      <button id="settings-btn" class="icon-btn settings-icon" title="Paramètres" data-i18n-title="settings_tooltip">
        <svg fill="none" width="24" height="24" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="tab-list" data-i18n="tab_shortcuts">Mes raccourcis</button>
      <button class="tab-btn" data-tab="tab-add" data-i18n="tab_add">Nouveau</button>
      <button class="tab-btn" data-tab="tab-data" data-i18n="tab_data">Données</button>
    </nav>

    <!-- LIST TAB -->
    <div class="tab-content" id="tab-list" style="display: flex;">
      <div class="toolbar">
        <div class="toolbar-group">
           <button class="icon-btn toolbar-btn active" id="view-list" data-i18n-title="view_list">
             <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
           </button>
           <button class="icon-btn toolbar-btn" id="view-grid" data-i18n-title="view_grid">
             <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
           </button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
           <button class="icon-btn toolbar-btn active" id="sort-asc" data-i18n-title="sort_asc">
             <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9M3 12h5m4-4v12m0 0l-4-4m4 4l4-4"></path></svg>
           </button>
           <button class="icon-btn toolbar-btn" id="sort-desc" data-i18n-title="sort_desc">
             <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9M3 12h5m4 8V4m0 0l-4 4m4-4l4 4"></path></svg>
           </button>
        </div>
      </div>
      <div class="shortcuts-list" id="shortcuts-list"></div>
    </div>

    <!-- ADD TAB -->
    <div class="tab-content" id="tab-add" style="display: none;">
      <div class="glass-card add-form">
        <h2 id="form-title" data-i18n="form_new">Nouveau Raccourci</h2>
        <input type="text" id="keyword-input" placeholder="Mot précis (ex: proj)" data-i18n-placeholder="placeholder_keyword" autocomplete="off">
        <input type="url" id="url-input" placeholder="URL associée (https://...)" data-i18n-placeholder="placeholder_url" autocomplete="off">
        <div class="form-actions">
          <button id="cancel-edit-btn" class="btn-outline" style="display: none;" data-i18n="btn_cancel">Annuler</button>
          <button id="add-btn" data-i18n="btn_add">Ajouter</button>
        </div>
      </div>
    </div>

    <!-- DATA TAB -->
    <div class="tab-content" id="tab-data" style="display: none;">
      <div class="glass-card drag-zone" id="drag-zone">
        <h2 data-i18n="data_title">Import / Export</h2>
        <p class="desc" data-i18n="data_desc">Sauvegardez vos liens ou restaurez-les depuis un fichier JSON.</p>
        
        <div style="display: flex; gap: 10px;">
          <button id="export-btn" class="btn-outline" data-i18n="btn_export">Exporter JSON</button>
          <label for="import-file" class="btn-outline upload-label" id="upload-label" data-i18n="btn_import">
            Importer JSON
          </label>
        </div>
        <input type="file" id="import-file" accept=".json" style="display: none;">
        
        <hr class="separator">
        
        <button id="wipe-data-btn" class="btn-danger" data-i18n="btn_wipe">Effacer toutes les données</button>
      </div>
    </div>

    <!-- SETTINGS OVERLAY -->
    <div class="overlay" id="settings-overlay">
      <div class="glass-card settings-card">
        <div class="settings-header">
          <h2 data-i18n="settings_title">Paramètres</h2>
          <button id="close-settings-btn" class="icon-btn close-icon"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        
        <div class="setting-group">
          <label data-i18n="settings_theme">Thème</label>
          <div class="custom-select" id="theme-custom-select" data-value="dark">
            <div class="select-selected"><span data-i18n="theme_dark">Sombre</span></div>
            <div class="select-items select-hide">
              <div data-value="dark" data-i18n="theme_dark">Sombre</div>
              <div data-value="light" data-i18n="theme_light">Clair</div>
            </div>
          </div>
        </div>

        <div class="setting-group" style="margin-top:20px;">
          <label data-i18n="settings_lang">Langue</label>
          <div class="custom-select" id="lang-custom-select" data-value="fr">
             <div class="select-selected"><span>Français</span></div>
             <div class="select-items select-up select-hide">
               <div data-value="fr">Français</div>
               <div data-value="en">English</div>
               <div data-value="es">Español</div>
               <div data-value="de">Deutsch</div>
             </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
